worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    limit_req_zone $client_ip zone=api:10m rate=30r/s;

    upstream backend {
        server api:3000;
        keepalive 32;
    }

    # This nginx only ever receives connections from the host nginx over plain
    # HTTP on 127.0.0.1:8080 (see CLAUDE.md §11/§2) — $scheme at this hop is
    # therefore always "http", even for a real end user's HTTPS request, which
    # clobbers whatever X-Forwarded-Proto the TLS-terminating host nginx set.
    # Every real client of api.fc.opslin.com goes through that HTTPS-only host
    # nginx, so the value is hardcoded here rather than recomputed from $scheme.
    # (Bug: ola-maps.controller.js#getStyleUrl trusted the wrong "http" value
    # this produced and handed the dashboard a http:// style URL, which every
    # browser blocks as mixed content on the HTTPS-served dashboard — the
    # Coverage Map's blank map. Any other code reading this header inherits
    # the same fix.)

    # Super Admin JWTs carry a large flattened permissions array and are
    # echoed back as a Set-Cookie header on login — well past nginx's
    # default 4k/8k proxy header buffer, which made every admin login
    # response 502 with "upstream sent too big header". Bumped generously
    # so this keeps working as the RBAC permission list grows.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 10M;

        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $client_ip;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_read_timeout 86400;
        }

        location /api/webhook/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $client_ip;
        }

        # Sell/exchange evidence (photos + QC video) can be far larger than other API bodies.
        # Streamed straight to the app (no buffering to disk); the app enforces the admin-set limits.
        location ~ ^/api/v1/(manage/)?(sell|exchange)-requests/media$ {
            client_max_body_size 520M;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            limit_req zone=api burst=10 nodelay;

            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header Connection "";
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header Connection "";
        }

        location = / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $client_ip;
        }

        location / {
            return 404 '{"success":false,"message":"Not found","code":"NOT_FOUND"}';
            add_header Content-Type application/json;
        }
    }
}
